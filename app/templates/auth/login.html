{% extends 'base.html' %}
{% block title %}Login — MediCare Hospital{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <svg width="40" height="40" viewBox="0 0 28 28" fill="none">
        <rect width="28" height="28" rx="8" fill="#1D4ED8"/>
        <rect x="12" y="5" width="4" height="18" rx="2" fill="white"/>
        <rect x="5" y="12" width="18" height="4" rx="2" fill="white"/>
      </svg>
    </div>
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-sub">Sign in to your MediCare account</p>

    <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" class="form-input"
               placeholder="you@example.com" required autofocus>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-eye-wrap">
          <input type="password" id="password" name="password" class="form-input"
                 placeholder="Your password" required>
          <button type="button" class="eye-toggle" onclick="toggleEye('password', this)">👁</button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full">Sign in</button>
    </form>

    <p class="auth-footer">
      Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a>
    </p>
  </div>
</div>
{% endblock %}
